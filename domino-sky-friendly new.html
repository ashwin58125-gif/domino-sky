<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOMINO SKY – Your Sky Control Room</title>
<style>
:root{--bg:#070d1f;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#eef4ff;--mut:#9fb3d1;--acc:#7c9cff;--pink:#ff7ad9;--ok:#5ee6b5;--warn:#ffc857;--bad:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--txt);min-height:100vh;padding:0 18px 40px;background:radial-gradient(1000px 500px at 0% -10%,#2b3a8a66,transparent),radial-gradient(800px 500px at 100% 0%,#7a2a7a44,transparent),var(--bg)}
h1{margin:0;font-size:clamp(22px,4vw,30px);background:linear-gradient(90deg,#fff,var(--acc),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:4px 0 10px;font-size:17px}
p{margin:4px 0}
.muted{color:var(--mut);font-size:13px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:20px 4px}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(10px)}
button,select,input{font:inherit;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,.ap:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.act,.big{background:linear-gradient(135deg,var(--acc),var(--pink));border:0;color:#fff;font-weight:600}
.big{padding:14px 22px;font-size:16px;border-radius:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px}
.tabs button{white-space:nowrap;border-radius:99px;background:transparent}
.tabs button.on{background:var(--card);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{text-align:center}.stat span{font-size:26px}.stat b{display:block;font-size:26px}.stat small{color:var(--mut)}
.mapgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:16px}
@media(max-width:800px){.mapgrid{grid-template-columns:1fr}}
.map{width:100%;height:auto;border-radius:18px;background:linear-gradient(160deg,#1b0f3a,#3a1244 55%,#0d2a3f)}
.map text{fill:#ffe9a8;font-size:11px;font-weight:600;paint-order:stroke;stroke:#1b0f3a;stroke-width:3px}
.route{stroke:rgba(94,230,181,.55);stroke-width:1.6}.route.late{stroke:#ff7ad9}
.route.cancel{stroke:var(--bad);stroke-dasharray:4 4;opacity:.7}
.plane{fill:#ffe9a8;font-size:16px}
.ap{cursor:pointer;outline:none}.ap:hover circle{stroke:#fff;stroke-width:1.5}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--pink));border-radius:99px;transition:width .6s}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.toolbar input{min-width:260px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--line);border-radius:99px;padding:5px 12px;font-size:13px;border-color:var(--c);color:var(--mut)}
.chip.on{background:rgba(124,156,255,.25);border-color:var(--acc);color:var(--txt)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.fcard{display:flex;flex-direction:column;gap:6px}
.fcard header,.scn .emo{display:flex;justify-content:space-between;align-items:center}
.rt{font-size:18px;font-weight:600}
.rt span{margin:0 8px;color:var(--acc)}
.pill{--c:var(--mut);display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);white-space:nowrap}
.scn{text-align:center}.scn .emo{justify-content:center;font-size:40px}
.hero{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9;max-width:92vw}
.toast{background:#17264af2;border:1px solid var(--acc);padding:10px 16px;border-radius:14px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.ringnum{font-size:22px;font-weight:700;fill:#fff}.ringlbl{font-size:10px;fill:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(3,6,18,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.sheet{width:min(620px,100%);max-height:88vh;overflow:auto;position:relative;background:#0f1d3cf2}.x{position:absolute;top:10px;right:10px}.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;margin-top:10px}.kv div{background:rgba(255,255,255,.04);border-radius:12px;padding:8px 10px;overflow-wrap:anywhere}.kv span{display:block;color:var(--mut);font-size:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header class="top">
  <div><h1 id="greet">Good morning</h1><p class="muted" id="sub"></p></div>
  <div id="ring" aria-live="polite"></div>
  <div class="ctrl">
    <label>🌅 <input type="range" id="clock" min="300" max="1440" step="15" aria-label="Time of day"> <b id="clk"></b> 🌙</label>
    <button id="undo" title="Undo the last change">↶ Undo</button>
    <button id="reset" title="Start the day again">↻ Start over</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="view"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const TURN=30,MAXDUTY=600,CAP=180,AP_CAP=6;
const AP_ALL={DEL:'Delhi',BOM:'Mumbai',BLR:'Bengaluru',MAA:'Chennai',CCU:'Kolkata',HYD:'Hyderabad',AMD:'Ahmedabad',COK:'Kochi',PNQ:'Pune',GOI:'Goa',JAI:'Jaipur',LKO:'Lucknow',PAT:'Patna',IXC:'Chandigarh',GAU:'Guwahati',TRV:'Thiruvananthapuram'};
const GEO={DEL:[28.56,77.10],BOM:[19.09,72.87],BLR:[13.20,77.71],MAA:[12.99,80.17],CCU:[22.65,88.45],HYD:[17.24,78.43],AMD:[23.07,72.63],COK:[10.15,76.40],PNQ:[18.58,73.92],GOI:[15.38,73.83],JAI:[26.82,75.81],LKO:[26.76,80.89],PAT:[25.59,85.09],IXC:[30.67,76.79],GAU:[26.11,91.59],TRV:[8.48,76.92]};
const CODES=Object.keys(AP_ALL);
const LBL={Scheduled:'🕒 Upcoming',Boarding:'🚪 Boarding','In Air':'🛫 In the air',Landed:'🛬 Landed',Delayed:'⏱ Late',Cancelled:'❌ Cancelled'};
const COL={Scheduled:'#9fb3d1',Boarding:'#7c9cff','In Air':'#7c9cff',Landed:'#5ee6b5',Delayed:'#ffc857',Cancelled:'#ff6b7a'};
const LINK={Safe:['🟢 Safe','#5ee6b5'],Tight:['🟡 Tight','#ffc857'],Missed:['🔴 Missed','#ff6b7a']};
const CHIPS=[['all','All'],['Scheduled','🕒 Upcoming'],['In Air','🛫 In the air'],['Landed','🛬 Landed'],['Late','⏱ Late'],['Cancelled','❌ Cancelled']];
const SCN=[
  ['⛈️','Storm over Delhi','Heavy rain closes Delhi airport.','Airport closed','DEL',0],
  ['🔧','Plane needs a check-up','A technical fault grounds VT-DS05.','Technical failure','VT-DS05',0],
  ['⏱','Flight running late','DS101 is held for 45 minutes.','Flight delay','DS101',45],
  ['🌫️','Fog at Bengaluru','Runways slow down by half.','Capacity cut','BLR',50],
  ['🧑‍✈️','Pilot off sick','VT-DS09 has no captain today.','Crew sick','VT-DS09',0],
  ['🌬️','Strong winds in Mumbai','Busy airport loses 30% capacity.','Capacity cut','BOM',30]
];

/* ---------- SAMPLE DATA (replace with your Domino Sky dataset) ---------- */
const S={tab:'board',now:600,q:'',chip:'all',sel:null,acts:[],diff:null,optLog:[],optPrev:null};
let seed,flights,fleet,conns,crewList,airports;
const $=id=>document.getElementById(id);
const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const pick=a=>a[Math.floor(rnd()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const xy=c=>{const[la,lo]=GEO[c];return[(lo-68)/30*540+30,(37-la)/31*460+30]};
const pill=s=>`<span class=pill style="--c:${COL[s]||'#9fb3d1'}">${LBL[s]||s}</span>`;

function build(){
  seed=42;S.optLog=[];S.optPrev=null;
  fleet=[];
  for(let i=1;i<=16;i++)fleet.push({reg:'VT-DS'+pad(i),loc:pick(CODES),spare:false,down:null});
  fleet.push({reg:'VT-DS17',loc:'BLR',spare:true,avail:300,down:null},{reg:'VT-DS18',loc:'DEL',spare:true,avail:300,down:null});
  flights=[];
  fleet.slice(0,16).forEach((a,k)=>{
    const n=k<6?5:4;let t=300+Math.floor(rnd()*120),loc=a.loc;
    for(let j=0;j<n;j++){
      let d;do{d=pick(CODES)}while(d===loc);
      const dur=50+Math.floor(rnd()*70);
      flights.push({num:'DS'+(101+flights.length),reg:a.reg,from:loc,to:d,dep:t,arr:t+dur,delay:0,dlay:0,
        pax:120+Math.floor(rnd()*60),cancelled:false,covered:false,adep:t,aarr:t+dur});
      t+=dur+45+Math.floor(rnd()*31);loc=d;
    }
  });
  conns=[];let g=0;
  while(conns.length<21&&g++<9000){
    const f=pick(flights);
    const c=flights.filter(x=>x.from===f.to&&x!==f&&x.dep-f.arr>=30&&x.dep-f.arr<=180);
    if(!c.length)continue;
    const b=pick(c);
    if(conns.some(q=>q.a===f&&q.b===b))continue;
    conns.push({id:'CX'+pad(conns.length+1),a:f,b,ap:f.to,pax:40+Math.floor(rnd()*100),min:45});
  }
  crewList=fleet.slice(0,16).map((a,i)=>({id:'CR'+pad(i+1),reg:a.reg,base:a.loc}));
  airports=Object.fromEntries(CODES.map(c=>[c,{closed:false,factor:1}]));
  recalc();
}

/* ---------- ENGINE ---------- */
function recalc(){
  flights.forEach(f=>{
    const ap=airports[f.from].closed||airports[f.to].closed;
    f.cancelled=!f.covered&&f.dep>=S.now&&(!!fleet.find(a=>a.reg===f.reg).down||ap);
  });
  const by={};
  flights.forEach(f=>{if(!f.cancelled)(by[f.reg]=by[f.reg]||[]).push(f)});
  Object.values(by).forEach(l=>{
    l.sort((x,y)=>x.dep-y.dep);let prev=null;
    l.forEach(f=>{
      let d=f.dep+f.delay;
      if(prev!==null)d=Math.max(d,prev+TURN);
      f.adep=d;f.aarr=d+f.arr-f.dep;f.dlay=d-f.dep;prev=f.aarr;
    });
  });
  flights.forEach(f=>{if(f.cancelled){f.adep=f.dep;f.aarr=f.arr;f.dlay=0}});
}
function fstat(f){
  if(f.cancelled)return 'Cancelled';
  if(f.aarr<=S.now)return 'Landed';
  if(f.adep<=S.now)return 'In Air';
  if(f.adep-S.now<=30)return 'Boarding';
  if(f.dlay>=15)return 'Delayed';
  return 'Scheduled';
}
function crewInfo(reg){
  const l=flights.filter(f=>f.reg===reg&&!f.cancelled);
  if(!l.length)return null;
  const s=Math.min(...l.map(f=>f.adep))-60,e=Math.max(...l.map(f=>f.aarr));
  return{s,e,duty:e-s};
}
function connStat(c){
  if(c.a.cancelled||c.b.cancelled)return{gap:null,s:'Missed'};
  const gap=c.b.adep-c.a.aarr;
  return{gap,s:gap<c.min?'Missed':gap<c.min+30?'Tight':'Safe'};
}
function airLoad(c){
  const h=Array(24).fill(0);
  flights.forEach(f=>{
    if(f.cancelled)return;
    if(f.from===c)h[Math.floor(f.adep/60)%24]++;
    if(f.to===c)h[Math.floor(f.aarr/60)%24]++;
  });
  return h;
}
const capOf=c=>AP_CAP*airports[c].factor;
function util(c){if(airports[c].closed)return 1;return Math.max(...airLoad(c))/Math.max(1,capOf(c))}
function metrics(){
  const cs=conns.map(connStat);
  const viol=crewList.filter(c=>{const i=crewInfo(c.reg);return i&&i.duty>MAXDUTY}).length;
  return{
    delayed:flights.filter(f=>!f.cancelled&&f.dlay>=15).length,
    cancelled:flights.filter(f=>f.cancelled).length,
    missed:cs.filter(c=>c.s==='Missed').length,
    atRisk:cs.filter(c=>c.s!=='Safe').length,
    viol,crewOk:crewList.length-viol,
    nearCap:CODES.filter(c=>util(c)>=0.8).length
  };
}
const problems=m=>m.delayed+m.cancelled+m.missed+m.viol;
function spareOK(a,f){
  const l=flights.filter(g=>g.reg===a.reg&&!g.cancelled);
  if(!l.length)return a.loc===f.from&&f.dep>=a.avail;
  const last=l.reduce((p,g)=>g.arr>p.arr?g:p);
  return last.to===f.from&&last.arr+TURN<=f.dep&&f.dep>=a.avail;
}

/* ---------- ACTIONS ---------- */
function applyRaw(t,g,v){
  if(t==='Flight delay')flights.find(f=>f.num===g).delay+=v;
  else if(t==='Technical failure'||t==='Crew sick')fleet.find(a=>a.reg===g).down=t;
  else if(t==='Airport closed')airports[g].closed=true;
  else airports[g].factor=Math.max(0,1-v/100);
}
function summarise(b,a){
  const out=[],dc=a.cancelled-b.cancelled,dl=a.delayed-b.delayed,dm=a.missed-b.missed,dv=a.viol-b.viol;
  if(dc>0)out.push(`❌ ${dc} more flight${dc>1?'s':''} cancelled.`);
  if(dl>0)out.push(`⏱ ${dl} more flight${dl>1?'s':''} running late.`);
  if(dm>0)out.push(`🔗 ${dm} connection${dm>1?'s':''} now missed.`);
  if(dv>0)out.push(`🧑‍✈️ ${dv} crew member${dv>1?'s':''} over their hours.`);
  if(a.nearCap>b.nearCap)out.push(`🛬 ${a.nearCap-b.nearCap} airport${a.nearCap-b.nearCap>1?'s':''} near capacity.`);
  return out.length?out:['✅ The network absorbed it with no new problems.'];
}
function act(t,g,v){
  const before=metrics();
  S.acts.push([t,g,v]);applyRaw(t,g,v);recalc();
  S.diff=summarise(before,metrics());
  toast(S.diff.join(' '));render();
}
function undo(){
  if(!S.acts.length)return toast('Nothing to undo 🙂');
  S.acts.pop();build();S.acts.forEach(a=>applyRaw(...a));S.diff=null;
  toast('Undone ↶');render();
}
function runOpt(){
  const before=problems(metrics());S.optLog=[];
  flights.filter(f=>!f.covered&&(f.cancelled||f.dlay>=30)).sort((x,y)=>x.dep-y.dep).forEach(f=>{
    const sp=fleet.find(a=>a.spare&&!a.down&&spareOK(a,f));
    if(sp){
      f.reg=sp.reg;f.covered=true;f.delay=0;
      S.optLog.push(`✅ ${f.num} (${f.from}→${f.to}) now flies with ${sp.reg}, a spare already waiting at ${f.from}.`);
    }else{
      S.optLog.push(`⚠️ ${f.num}: no spare is free at ${f.from}, so it stays ${f.cancelled?'cancelled':'late'}.`);
    }
  });
  S.optPrev=before;recalc();
  toast(`Fixed what I could: ${before} → ${problems(metrics())} problems`);render();
}
function resetSim(){S.now=600;S.acts=[];S.diff=null;build();toast('Fresh start ✨');render()}
function toast(msg){
  const d=document.createElement('div');d.className='toast';d.textContent=msg;
  $('toasts').appendChild(d);setTimeout(()=>d.remove(),3800);
}

/* ---------- VIEWS ---------- */
function vMap(){
  const m=metrics();
  const routes=flights.filter(f=>!f.cancelled).map(f=>{const[a,b]=xy(f.from),[c,d]=xy(f.to);return `<line x1=${a} y1=${b} x2=${c} y2=${d} class="route${f.dlay>=15?' late':''}"/>`}).join('');
  const cancels=flights.filter(f=>f.cancelled).map(f=>{const[a,b]=xy(f.from),[c,d]=xy(f.to);return `<line x1=${a} y1=${b} x2=${c} y2=${d} class="route cancel"/>`}).join('');
  const planes=flights.filter(f=>fstat(f)==='In Air').map(f=>{
    const[a,b]=xy(f.from),[c,d]=xy(f.to),p=(S.now-f.adep)/(f.aarr-f.adep),x=a+(c-a)*p,y=b+(d-b)*p,ang=Math.atan2(d-b,c-a)*180/Math.PI;
    return `<text x=${x} y=${y} class=plane transform="rotate(${ang} ${x} ${y})"><title>${f.num}</title>✈</text>`}).join('');
  const dots=CODES.map(c=>{
    const[x,y]=xy(c),u=util(c),n=flights.filter(f=>!f.cancelled&&(f.from===c||f.to===c)).length,col=u>=1?'var(--bad)':u>=.8?'var(--warn)':'var(--ok)';
    return `<g class=ap tabindex=0 role=button aria-label="${AP_ALL[c]}" onclick="S.sel='${c}';render()" onkeydown="if(event.key==='Enter'){S.sel='${c}';render()}">
      <title>${AP_ALL[c]}</title><circle cx=${x} cy=${y} r=${6+n*0.5} fill=${col} opacity=.22 /><circle cx=${x} cy=${y} r=5.5 fill=${col} /><text x=${x+9} y=${y+4}>${c}</text></g>`;
  }).join('');
  const grid='<defs><pattern id=gp width=40 height=40 patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill=none stroke="rgba(255,200,120,.08)"/></pattern></defs><rect width=600 height=520 fill="url(#gp)"/>';
  const stat=(e,n,l)=>`<div class="glass stat"><span>${e}</span><b>${n}</b><small>${l}</small></div>`;
  const sel=S.sel?airCard(S.sel):'<p class=muted>Tap an airport on the map to see how busy it is.</p>';
  return `<div class=stats>${stat('🛫',flights.filter(f=>fstat(f)==='In Air').length,'in the air')}${stat('⏱',m.delayed,'running late')}${stat('❌',m.cancelled,'cancelled')}${stat('🧑‍✈️',m.crewOk+' / '+crewList.length,'crews within hours')}</div>
  <div class=mapgrid><div class=glass>
    <label class=muted>Find an airport <select onchange="S.sel=this.value;render()"><option value="">Choose…</option>${CODES.map(c=>`<option value="${c}" ${S.sel===c?'selected':''}>${c} · ${AP_ALL[c]}</option>`).join('')}</select></label>
    <svg class=map viewBox="0 0 600 520" role=img aria-label="Map of the Domino Sky network">${grid}${cancels}${routes}${dots}${planes}</svg>
  </div><aside class=glass>${sel}</aside></div>`;
}
function airCard(c){
  const u=util(c),n=flights.filter(f=>!f.cancelled&&(f.from===c||f.to===c)).length;
  const mood=airports[c].closed?'🚫 Closed. Flights are being moved elsewhere':u>=1?'🔴 Full at peak hour':u>=.8?'🟡 Getting busy':'🟢 Comfortable';
  return `<h3>${c} · ${AP_ALL[c]}</h3><p>${mood}</p><p class=muted>${n} flights touch this airport today.</p>
  <div class=bar><i style="width:${Math.min(100,u*100)}%"></i></div>
  <p class=muted>Busiest hour: ${Math.max(...airLoad(c))} movements against ${Math.round(capOf(c))} allowed.</p>
  <button class=act style="margin-top:8px" onclick="S.detail={k:'air',id:'${c}'};render()">Full airport details</button>`;
}
function flightCard(f,s){
  const pr=f.cancelled?0:S.now>=f.aarr?100:S.now<=f.adep?0:(S.now-f.adep)/(f.aarr-f.adep)*100;
  const note=f.cancelled?'Passengers are being rebooked':f.dlay>=15?`Running ${f.dlay} min late`:f.dlay>0?`Slightly late (${f.dlay} min)`:'On time 👍';
  return `<article class="glass fcard" tabindex=0 role=button style="cursor:pointer" onclick="S.detail={k:'flight',id:'${f.num}'};render()"><header><b>${f.num}</b>${pill(s)}</header>
  <div class=rt>${f.from}<span>✈</span>${f.to}</div>
  <p class=muted>${f.reg} · ${f.pax} travellers (${Math.round(f.pax/CAP*100)}% full) · ${hm(f.cancelled?f.dep:f.adep)} → ${hm(f.cancelled?f.arr:f.aarr)}</p>
  <div class=bar><i style="width:${pr}%"></i></div><small>${note}</small></article>`;
}
function vFlights(){
  const q=S.q.trim().toLowerCase();
  const list=flights.map(f=>({f,s:fstat(f)})).filter(({f,s})=>
    (S.chip==='all'||s===S.chip||(S.chip==='Late'&&f.dlay>=15&&!f.cancelled))&&
    (!q||[f.num,f.from,f.to,f.reg].join(' ').toLowerCase().includes(q)));
  return `<div class=toolbar><input id=q type=search placeholder="Search a flight, airport or aircraft…" value="${S.q}" aria-label="Search flights" oninput="S.q=this.value;render()">
  <div class=chips>${CHIPS.map(([k,l])=>`<button class="chip${S.chip===k?' on':''}" onclick="S.chip='${k}';render()">${l}</button>`).join('')}</div></div>
  <p class=muted>${list.length} flight${list.length===1?'':'s'} shown</p>
  <div class=cards>${list.map(({f,s})=>flightCard(f,s)).join('')||'<p class=muted>No flights match. Try another search 🔍</p>'}</div>`;
}
function vFleet(){
  const cards=fleet.map(a=>{
    const l=flights.filter(f=>f.reg===a.reg&&!f.cancelled).sort((x,y)=>x.dep-y.dep);
    const next=l.find(f=>f.adep>=S.now),done=l.filter(f=>f.aarr<=S.now).pop();
    const mins=l.reduce((s,f)=>s+f.arr-f.dep,0),busy=Math.min(100,Math.round(mins/1140*100));
    const status=a.down?`<span class=pill style="--c:#ff6b7a">🔧 Grounded · ${a.down}</span>`:'<span class=pill style="--c:#5ee6b5">✅ Ready to fly</span>';
    return `<article class="glass fcard" tabindex=0 role=button style="cursor:pointer" onclick="S.detail={k:'reg',id:'${a.reg}'};render()"><header><b>${a.reg}</b>${a.spare?'<span class=pill style="--c:#ff7ad9">🛟 Spare</span>':''}</header>
    <p>📍 At <b>${done?done.to:a.loc}</b></p><p class=muted>${next?'Next: '+next.num+' at '+hm(next.adep):'No more flights today'}</p>${status}
    <div class=bar style="margin-top:8px"><i style="width:${busy}%"></i></div><small class=muted>Busy ${busy}% of the day</small></article>`;
  }).join('');
  const crew=crewList.map(c=>{const i=crewInfo(c.reg),ok=!i||i.duty<=MAXDUTY;
    return `<span class=chip style="--c:${ok?'#5ee6b5':'#ff6b7a'};color:var(--txt)">${ok?'✔':'⚠'} ${c.id} · ${i?i.duty+' / '+MAXDUTY+' min':'off duty'}</span>`}).join('');
  return `<h3>Aircraft</h3><div class=cards>${cards}</div><h3>Crew hours</h3><div class=chips>${crew}</div>
  <p class=muted>Crew duty includes a 60-minute pre-flight briefing.</p>`;
}
function vLinks(){
  const st=conns.map(connStat),bad=st.filter(s=>s.s!=='Safe'),pax=conns.reduce((s,c,i)=>st[i].s!=='Safe'?s+c.pax:s,0);
  return `<div class=glass style="margin-bottom:16px"><h3 style="margin:0">${conns.length} passenger connections</h3>
  <p class=muted>${bad.length?`${bad.length} need attention, affecting about ${pax} travellers.`:'Everyone should make their connections 🎉'}</p></div>
  <div class=cards>${conns.map((c,i)=>{const s=st[i],[lab,col]=LINK[s.s];
    return `<article class=glass style="border-left:4px solid ${col}"><header><b>${c.id}</b><span class=pill style="--c:${col}">${lab}</span></header>
    <p>${c.a.num} ${c.a.from}→${c.a.to} <span class=muted>then</span> ${c.b.num} ${c.b.from}→${c.b.to}</p>
    <p class=muted>Connects at ${c.ap} · ${c.pax} travellers · needs ${c.min} min${s.gap!==null?` · gives ${s.gap} min`:' · flight cancelled'}</p></article>`}).join('')}</div>`;
}
function vWhat(){
  const d=S.diff;
  return `<p class=muted>Try a surprise and watch the network respond. Every step can be undone.</p>
  <div class=cards>${SCN.map(([e,t,desc,type,g,v])=>`<article class="glass scn"><div class=emo>${e}</div><h3>${t}</h3><p class=muted>${desc}</p>
    <button class=act onclick="act('${type}','${g}',${v})">Try it</button></article>`).join('')}</div>
  <div class=glass><h3>What just happened</h3>${d?d.map(x=>`<p>${x}</p>`).join(''):'<p class=muted>Pick a scenario to see its effect.</p>'}
  ${S.acts.length?`<p class=muted style="margin-top:10px">Active changes: ${S.acts.map(a=>a[0]+' · '+a[1]).join(', ')}</p>`:''}</div>`;
}
function vFix(){
  const m=metrics(),P=problems(m),p=S.optPrev;
  return `<div class="glass hero"><div><h3>Problems right now: <b>${P}</b></h3>
  <p class=muted>${m.cancelled} cancelled · ${m.delayed} late · ${m.missed} missed connections · ${m.viol} crew over hours</p></div>
  <button class=big onclick="runOpt()">✨ Fix what I can</button></div>
  <p class=muted>A spare plane is only used when it's already at the right airport, has time to turn around, and fits every passenger.</p>
  ${p!==null?`<div class=glass style="margin-top:14px"><h3>Result</h3><p>Problems went from <b>${p}</b> to <b>${P}</b>.</p>
  ${S.optLog.map(x=>`<p>${x}</p>`).join('')||'<p class=muted>Nothing needed fixing 🎉</p>'}</div>`
  :'<p class=muted style="margin-top:14px">Press the button and I\'ll show what changed and why.</p>'}`;
}

/* ---------- LIVE BOARD ---------- */
function vBoard(){
  const m=metrics(),stat=(e,n,l)=>`<div class="glass stat"><span>${e}</span><b>${n}</b><small>${l}</small></div>`;
  const dep=flights.filter(f=>!f.cancelled&&f.adep>=S.now-30).sort((x,y)=>x.adep-y.adep).slice(0,12);
  const arr=flights.filter(f=>!f.cancelled&&f.aarr>=S.now).sort((x,y)=>x.aarr-y.aarr).slice(0,8);
  const top=CODES.map(c=>({c,u:util(c)})).sort((a,b)=>b.u-a.u).slice(0,5);
  const row=(t,f,s,note)=>`<div role=button tabindex=0 onclick="S.detail={k:'flight',id:'${f.num}'};render()" style="display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer"><b style="font-size:18px">${hm(t)}</b><div><b>${f.num}</b> <span class=muted>${f.reg}</span><div>${f.from} → ${f.to} <span class=muted>· ${note}</span></div></div>${pill(s)}</div>`;
  const list=(title,items)=>`<div class=glass><h3>${title}</h3>${items.join('')||'<p class=muted>Nothing scheduled right now</p>'}</div>`;
  return `<div class=stats>${stat('🛫',flights.filter(f=>fstat(f)==='In Air').length,'in the air')}${stat('⏱',m.delayed,'running late')}${stat('❌',m.cancelled,'cancelled')}${stat('🧑‍✈️',m.crewOk+' / '+crewList.length,'crews within hours')}</div>
  <div class=glass style="margin-bottom:14px"><h3>Busiest airports right now</h3><div class=chips>${top.map(({c,u})=>`<span class=chip style="--c:${u>=1?'#ff6b7a':u>=.8?'#ffc857':'#5ee6b5'};color:var(--txt)">${c} · ${Math.round(u*100)}%</span>`).join('')}</div></div>
  <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${list('🛫 Next departures',dep.map(f=>row(f.adep,f,fstat(f),`to ${AP_ALL[f.to]}${f.dlay>=15?' · '+f.dlay+' min late':''}`)))}${list('🛬 Next arrivals',arr.map(f=>row(f.aarr,f,fstat(f),`from ${AP_ALL[f.from]}`)))}</div>`;
}

/* ---------- CHECKS ---------- */
function vTests(){
  const rows=[],add=(n,bad)=>rows.push([n,bad.length===0,bad.length?`${bad.length} issue(s): ${bad.slice(0,4).join(', ')}`:'No issues found']);
  const by={};flights.filter(f=>!f.cancelled).forEach(f=>(by[f.reg]=by[f.reg]||[]).push(f));
  const turn=[],ovl=[],route=[];
  Object.values(by).forEach(l=>{l.sort((x,y)=>x.adep-y.adep);for(let i=1;i<l.length;i++){const p=l[i-1],c=l[i];if(c.adep<p.aarr+TURN)turn.push(c.num);if(c.adep<p.aarr)ovl.push(c.num);if(c.from!==p.to)route.push(c.num)}});
  add('Turnaround of at least 30 min',turn);
  add('No overlapping flights per aircraft',ovl);
  add('Aircraft follow their route sequence',route);
  add('Passengers within 180 seats',flights.filter(f=>f.pax>CAP).map(f=>f.num));
  add('Crew duty within 600 min',crewList.filter(c=>{const i=crewInfo(c.reg);return i&&i.duty>MAXDUTY}).map(c=>c.id));
  add('Spare aircraft start from 05:00',flights.filter(f=>f.covered&&f.dep<300).map(f=>f.num));
  add('Connections have positive gaps',conns.filter(c=>{const g=connStat(c).gap;return g!==null&&g<0}).map(c=>c.id));
  const pass=rows.filter(r=>r[1]).length;
  return `<div class=glass style="margin-bottom:14px"><h3>${pass} of ${rows.length} checks passing</h3><p class=muted>These run against the current schedule. A failing check is a real rule breach.</p></div>
  <div class=cards>${rows.map(([n,p,d])=>`<article class=glass><header><b>${n}</b><span class=pill style="--c:${p?'#5ee6b5':'#ff6b7a'}">${p?'✅ Pass':'❌ Fail'}</span></header><p class=muted>${d}</p></article>`).join('')}</div>`;
}

/* ---------- DETAILS ---------- */
const kv=(k,v)=>`<div><span>${k}</span>${v}</div>`;
function detailModal(){
  const d=S.detail,body=d.k==='flight'?flightDetail(d.id):d.k==='air'?airDetail(d.id):regDetail(d.id);
  return `<div class=modal onclick="if(event.target===this){S.detail=null;render()}"><div class="glass sheet" role=dialog aria-modal=true>
    <button class=x onclick="S.detail=null;render()" aria-label="Close">✕</button>${body}
    <p class=muted style="margin-top:12px">Sample data · simulated network</p></div></div>`;
}
function flightDetail(id){
  const f=flights.find(x=>x.num===id);if(!f)return '';
  const l=flights.filter(g=>g.reg===f.reg&&!g.cancelled).sort((x,y)=>x.dep-y.dep),i=l.indexOf(f),prev=i>0?l[i-1]:null,next=i>=0&&i<l.length-1?l[i+1]:null;
  const cx=conns.filter(c=>c.a===f||c.b===f),crew=crewList.find(c=>c.reg===f.reg),ci=crew&&crewInfo(f.reg);
  const lf=Math.round(f.pax/CAP*100);
  return `<h3>${f.num} · ${f.from} → ${f.to}</h3><p>${pill(fstat(f))}</p><p class=muted>${AP_ALL[f.from]} to ${AP_ALL[f.to]}</p>
  <div class=kv>${kv('Aircraft',f.reg+(f.covered?' (spare)':''))}${kv('Seats',CAP)}${kv('Travellers',f.pax)}${kv('Load factor',lf+'%')}
  ${kv('Scheduled',hm(f.dep)+' → '+hm(f.arr))}${kv('Actual',f.cancelled?'—':hm(f.adep)+' → '+hm(f.aarr))}${kv('Block time',(f.arr-f.dep)+' min')}${kv('Delay',f.cancelled?'—':f.dlay+' min')}
  ${kv('Turnaround before',prev&&!f.cancelled?(f.adep-prev.aarr)+' min after '+prev.num:'Starts the aircraft\'s day here')}${kv('Next on this aircraft',next?next.num+' at '+hm(next.adep):'None today')}
  ${kv('Crew',crew?crew.id+(ci?' · '+ci.duty+' / '+MAXDUTY+' min used':''):'—')}${kv('Connections',cx.length?cx.map(c=>c.id).join(', '):'None')}</div>
  ${cx.length?`<div class=glass style="margin-top:10px"><b>Connecting passengers</b>${cx.map(c=>`<p>${c.id}: ${c.pax} travellers at ${c.ap}, ${LINK[connStat(c).s][0]}</p>`).join('')}</div>`:''}
  <div class=bar style="margin-top:12px"><i style="width:${lf}%"></i></div><small class=muted>${lf}% of seats filled</small>`;
}
function airDetail(c){
  const h=airLoad(c),cap=Math.max(1,Math.round(capOf(c))),u=util(c),pk=h.indexOf(Math.max(...h));
  const fl=flights.filter(f=>!f.cancelled&&(f.from===c||f.to===c)).sort((x,y)=>(x.from===c?x.dep:x.arr)-(y.from===c?y.dep:y.arr));
  const arr=fl.filter(f=>f.to===c).length;
  return `<h3>${c} · ${AP_ALL[c]}</h3><p>${airports[c].closed?'🚫 Closed today':airports[c].factor<1?'⚠️ Reduced to '+Math.round(airports[c].factor*100)+'% of normal capacity':'🟢 Operating normally'}</p>
  <div class=kv>${kv('Hourly capacity',cap)}${kv('Utilisation',Math.round(u*100)+'%')}${kv('Arrivals',arr)}${kv('Departures',fl.length-arr)}${kv('Peak hour',pad(pk)+':00')}${kv('Movements',h.reduce((s,n)=>s+n,0))}</div>
  <div style="display:flex;align-items:flex-end;gap:3px;height:90px;margin:14px 0 4px">${h.map((n,i)=>`<i title="${pad(i)}:00 · ${n} movements" style="flex:1;border-radius:4px 4px 0 0;background:${n/cap>=1?'var(--bad)':n/cap>=.8?'var(--warn)':'var(--acc)'};height:${n?Math.min(100,Math.max(6,n/cap*100)):2}%"></i>`).join('')}</div>
  <small class=muted>Movements by hour. Bar height shows share of hourly capacity.</small>
  <h3 style="margin-top:14px">Schedule</h3>${fl.slice(0,20).map(f=>`<p>${f.num} · ${f.from===c?'departs '+hm(f.adep)+' to '+f.to:'arrives '+hm(f.aarr)+' from '+f.from} · ${f.reg}</p>`).join('')}`;
}
function regDetail(reg){
  const a=fleet.find(x=>x.reg===reg),l=flights.filter(f=>f.reg===reg).sort((x,y)=>x.dep-y.dep);
  const crew=crewList.find(c=>c.reg===reg),ci=crewInfo(reg),mins=l.filter(f=>!f.cancelled).reduce((s,f)=>s+f.arr-f.dep,0);
  return `<h3>${reg}${a.spare?' · spare':''}</h3><p>${a.down?'🔧 Grounded: '+a.down:'✅ Ready to fly'}</p>
  <div class=kv>${kv('Seats',CAP)}${kv('Base',a.loc)}${kv('Flights today',l.filter(f=>!f.cancelled).length)}${kv('Flying time',mins+' min')}${kv('Crew',crew?crew.id:'—')}${kv('Crew duty',ci?ci.duty+' / '+MAXDUTY+' min':'—')}</div>
  <h3 style="margin-top:14px">Flight sequence</h3>${l.map(f=>`<p class="${f.cancelled?'muted':''}">${f.num} · ${f.from} → ${f.to} · ${f.cancelled?'cancelled':hm(f.adep)+' → '+hm(f.aarr)}${f.covered?' (covered by spare)':''}</p>`).join('')||'<p class=muted>No flights assigned</p>'}`;
}

/* ---------- SHELL ---------- */
const TABS=[['board','🛫 Live board',vBoard],['flights','✈️ Flights',vFlights],['fleet','🛠️ Fleet & Crew',vFleet],['links','🔗 Connections',vLinks],['whatif','🌪️ What if?',vWhat],['fix','✨ Auto-fix',vFix],['tests','🧪 Checks',vTests]];
function header(){
  const m=metrics(),h=Math.floor(S.now/60),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  $('greet').textContent=g+', controller 👋';
  const air=flights.filter(f=>fstat(f)==='In Air').length;
  $('sub').textContent=`${air} planes in the air now · ${m.delayed} running late · ${m.atRisk} connections to check`;
  const pct=Math.round(flights.filter(f=>!f.cancelled&&f.dlay<15).length/flights.length*100);
  $('ring').innerHTML=`<svg viewBox="0 0 120 120" width=110 height=110 role=img aria-label="${pct} percent on time">
    <defs><linearGradient id=rg><stop offset=0 stop-color="#7c9cff"/><stop offset=1 stop-color="#ff7ad9"/></linearGradient></defs>
    <circle cx=60 cy=60 r=50 fill=none stroke="rgba(255,255,255,.1)" stroke-width=12 />
    <circle cx=60 cy=60 r=50 fill=none stroke="url(#rg)" stroke-width=12 stroke-linecap=round stroke-dasharray="${pct*3.14} 999" transform="rotate(-90 60 60)"/>
    <text x=60 y=58 text-anchor=middle class=ringnum>${pct}%</text><text x=60 y=76 text-anchor=middle class=ringlbl>on time</text></svg>`;
  $('clock').value=S.now;$('clk').textContent=hm(S.now);
}
function render(){
  const f=document.activeElement,fid=f&&f.id,pos=f&&f.selectionStart;
  recalc();header();
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button role=tab aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('');
  $('view').innerHTML=TABS.find(t=>t[0]===S.tab)[2]();
  if(S.detail)$('view').insertAdjacentHTML('beforeend',detailModal());
  if(fid){const e=$(fid);if(e){e.focus();if(pos!=null&&e.setSelectionRange)e.setSelectionRange(pos,pos)}}
}
$('clock').addEventListener('input',e=>{S.now=+e.target.value;render()});
$('undo').onclick=undo;
$('reset').onclick=resetSim;
build();render();
</script>
</body></html>
